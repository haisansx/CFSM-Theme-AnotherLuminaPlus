    <meta name="description" content="A restrained modern theme for CF-Server-Monitor." />
    <script>
      (() => {
        // 超前核心 API 预加载：利用浏览器解析 HTML 与下载 React Bundle 的网络空档期，提前并发拉取关键数据
        try {
          if (typeof window !== "undefined" && typeof fetch === "function") {
            const getMeta = (name) => {
              const el = document.querySelector(`meta[name="${name}"]`);
              return el ? (el.content || "").trim() : "";
            };
            const stripTrailing = (s) => (s || "").replace(/\/+$/, "");
            const normalizeBase = (val) => {
              const raw = stripTrailing(val);
              if (!raw) return "";
              try {
                return stripTrailing(new URL(raw, window.location.href).origin);
              } catch {
                return "";
              }
            };
            const rawBases = getMeta("apiBase");
            let bases = [];
            if (rawBases) {
              bases = rawBases.split(",").map(normalizeBase).filter(Boolean);
            }
            if (bases.length === 0) {
              bases = [stripTrailing(window.location.origin)];
            }
            bases = Array.from(new Set(bases));

            const getStorage = (k) => {
              try { return localStorage.getItem(k) || ""; } catch { return ""; }
            };
            const headers = { Accept: "application/json" };
            const jwt = getStorage("jwt_token");
            if (jwt) headers["Authorization"] = "Bearer " + jwt;
            const turnstileVerified = getStorage("turnstile_verified");
            if (turnstileVerified) {
              headers["X-Turnstile-Verified"] = turnstileVerified;
            } else {
              const turnstileToken = getStorage("turnstile_token");
              if (turnstileToken) headers["X-Turnstile-Token"] = turnstileToken;
            }

            const primaryBase = bases[0] || "";
            // 预取主站 /api/config
            const configPromise = fetch(primaryBase + "/api/config", {
              credentials: "include",
              headers,
            }).then(r => r.ok ? r.json() : null).catch(() => null);

            // 预取各站 /api/servers
            const serversPromises = bases.map(base => ({
              base,
              promise: fetch(base + "/api/servers", {
                credentials: "include",
                headers,
              }).then(async r => {
                if (!r.ok) return { base, error: new Error(`HTTP ${r.status}`) };
                const data = await r.json();
                return { base, data };
              }).catch(err => ({ base, error: err })),
            }));

            window.__EARLY_DATA__ = {
              config: configPromise,
              servers: serversPromises,
            };
          }
        } catch {}

        try {
          const cachedTitle = localStorage.getItem("cfsmtheme:sitename") || localStorage.getItem("komaritheme:sitename");
          if (cachedTitle && cachedTitle.trim()) {
            document.title = cachedTitle.trim();
            const setMeta = (sel, val) => {
              const el = document.querySelector(sel);
              if (el) el.setAttribute("content", val);
            };
            setMeta('meta[name="apple-mobile-web-app-title"]', cachedTitle.trim());
            setMeta('meta[property="og:title"]', cachedTitle.trim());
            setMeta('meta[name="twitter:title"]', cachedTitle.trim());
          }
          const cachedDesc = localStorage.getItem("cfsmtheme:description") || localStorage.getItem("komaritheme:description");
          if (cachedDesc && cachedDesc.trim()) {
            const setMeta = (sel, val) => {
              const el = document.querySelector(sel);
              if (el) el.setAttribute("content", val);
            };
            setMeta('meta[name="description"]', cachedDesc.trim());
            setMeta('meta[property="og:description"]', cachedDesc.trim());
            setMeta('meta[name="twitter:description"]', cachedDesc.trim());
          }
        } catch {}
        const appearances = new Set(["system", "light", "dark"]);
        const readAppearance = (key) => {
          const raw = localStorage.getItem(key);
          if (raw == null) return null;
          let value = raw;
          try {
            value = JSON.parse(raw);
          } catch {}
          if (!appearances.has(value)) return null;
          const normalized = JSON.stringify(value);
          if (raw !== normalized) localStorage.setItem(key, normalized);
          return value;
        };

        let appearance = "system";
        try {
          appearance = readAppearance("appearance") ?? readAppearance("appearance_default") ?? "system";
        } catch {
          appearance = "system";
        }
        const resolved =
          appearance === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : appearance;
        document.documentElement.dataset.appearance = resolved;
        document.documentElement.style.colorScheme = resolved;
        const isDark = resolved === "dark";
        const color = isDark ? "#09090b" : "#f4f5f7";
        document.documentElement.style.backgroundColor = color;
        const metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach((el) => el.remove());
        const meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = color;
        document.head.appendChild(meta);
        const statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) {
          statusMeta.content = isDark ? "black-translucent" : "default";
        }

        try {
          const rawDepth = localStorage.getItem("komaritheme:dark-depth");
          if (rawDepth != null) {
            const parsedDepth = Number(rawDepth);
            const darkDepth = Number.isFinite(parsedDepth)
              ? Math.min(100, Math.max(0, Math.round(parsedDepth)))
              : 0;
            if (darkDepth > 0) {
              document.documentElement.style.setProperty(
                "--dark-depth",
                String(darkDepth),
              );
            } else {
              document.documentElement.style.removeProperty("--dark-depth");
            }
          }
        } catch {}
      })();
    </script>
